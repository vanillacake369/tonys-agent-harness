name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: extractions/setup-just@v3
      - name: Verify tag and test
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\n' <cli/version.txt)
          test "$GITHUB_REF_NAME" = "v$version"
          just verify
          sh dev/install-release_test.sh
      - name: Build release archives
        shell: bash
        run: |
          nix develop --no-update-lock-file -c bash dev/build-release.sh
          cp install.sh dist/install.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt dist/install.sh \
            --generate-notes --verify-tag
