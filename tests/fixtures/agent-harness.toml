schema_version = 1
preset = "infra-devops"

[project]
instruction = "AGENTS.md"
spec_root = ".codex"

[project.guides]
enabled = false
source = ""
link = ".agent-context/team-guides"

[providers]
codex = true
claude = false
gemini = true
kiro = true

[workflow]
public_commands = ["cmd-mid-work-ljh", "cmd-mid-comment-ljh", "cmd-post-blog-ljh", "cmd-post-handoff-ljh", "cmd-post-ship-ljh", "cmd-post-commit-ljh"]
roles = ["requirement-designer", "researcher", "architect", "implementer", "reviewer"]

[permissions]
secret_access = "deny"
reviewer_write = false
researcher_write = false
single_writer = true

[approval]
production = true
destructive = true
migration = true
external_mutation = true
public_key_path = ""
expected_fingerprint = ""

[verification]
retry_max = 3
require_clean_git_for_done = true
